<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>MAB Studio | 高精細3D</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Yu Gothic UI",Meiryo,sans-serif;background:#0b1422;color:#e8f0fc}body{overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;min-height:400px}
header{background:#121f33;border-bottom:1px solid #294158;min-height:65px;display:flex;align-items:center;padding:11px 22px;gap:20px;justify-content:space-between;z-index:1;flex-wrap:wrap}
.heading strong{display:block;font-size:18px;font-weight:700;letter-spacing:.01em}.heading small{display:block;color:#a7bed8;font-size:11px;margin-top:4px}.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
button{font:inherit;color:#e8f0fc;background:#233a56;border:1px solid #425f7d;border-radius:8px;cursor:pointer;padding:9px 13px;font-size:12px}button:hover{background:#365578}button:focus-visible,input:focus-visible{outline:2px solid #84bfff;outline-offset:3px}button.active{background:#255a96;border-color:#79baff}
.view-presets{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.view-presets button{padding:7px 9px;font-size:12px}
.view-presets .label{font-size:12px;color:#a7bed8;margin-right:3px}
#stage{flex:1;position:relative;min-height:200px;background:radial-gradient(ellipse at 48% 40%,#1d334c,#0b1524 82%);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas.dragging{cursor:grabbing}
#hud{position:absolute;top:17px;left:20px;pointer-events:none;background:#0a1628cf;border:1px solid #39516b;border-radius:10px;padding:13px 16px;max-width:min(450px,70vw)}
#hud .sub{color:#a7c4df;font-size:12px;margin-top:5px}#hud strong{font-size:14px}
#help{position:absolute;bottom:14px;right:19px;font-size:12px;color:#b1c5df;text-shadow:0 1px 3px #05101e;pointer-events:none}
#status{position:absolute;bottom:15px;left:20px;font-size:12px;color:#99bad3;max-width:65vw}
#section{display:flex;align-items:center;gap:13px;padding:11px 22px;border-top:1px solid #294158;background:#121f33;min-height:57px;font-size:13px}
#section label{white-space:nowrap}#section input[type=range]{width:min(480px,45vw);accent-color:#79baff}#section output{font-variant-numeric:tabular-nums;min-width:55px;color:#b2c9e6}#section .note{font-size:11px;color:#a6b9cf;margin-left:auto}
#error{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(650px,90vw);background:#311c28;border:1px solid #ff7e8e;padding:24px;border-radius:12px;z-index:2;white-space:pre-wrap;color:#fff;font-size:14px;line-height:1.7}
@media(max-width:720px){header{padding:9px 12px;gap:10px}.heading strong{font-size:14px}#hud{top:10px;left:10px;padding:9px}#help{right:9px;font-size:10px}#section{padding:8px 12px;gap:8px}.note{display:none}}
</style>
</head>
<body>
<div id="app">
<header><div class="heading"><strong>MAB Studio <span style="color:#88c8ff">GPU 3Dプレビュー</span></strong><small>オフライン・SOURCE由来データのみ・Minecraftへの施工なし</small></div>
<div class="controls">
<div class="view-presets" role="group" aria-label="カメラの視点切替"><span class="label">視点</span>
<button id="view-iso" class="active" aria-pressed="true" title="ショートカット 1">斜め</button>
<button id="view-front" aria-pressed="false" title="ショートカット 2">正面</button>
<button id="view-back" aria-pressed="false" title="ショートカット 3">背面</button>
<button id="view-left" aria-pressed="false" title="ショートカット 4">左側</button>
<button id="view-right" aria-pressed="false" title="ショートカット 5">右側</button>
<button id="view-top" aria-pressed="false" title="ショートカット 6">上面</button></div>
<button id="perspective" class="active" aria-pressed="true">遠近表示</button><button id="orthographic" aria-pressed="false">平行投影</button>
<button id="reset">全体表示</button><button id="save">PNG保存</button>
</div></header>
<div id="stage"><canvas id="view" tabindex="0" aria-label="マウスで回せる建築モデルのWebGLプレビュー"></canvas>
<div id="hud"><strong id="scene-name">建築プレビュー</strong><div class="sub" id="scene-stats">初期化中…</div></div>
<div id="help">ドラッグ: 回転　Shift／右ドラッグ: 移動　ホイール: カーソル位置で拡大　F: 全体　1〜6: 視点</div>
<div id="status">GPUレンダラーを確認中…</div><div id="error" role="alert"></div></div>
<div id="section"><label for="slice">Y断面（上の階を隠す）</label><input id="slice" type="range" step="1"><output id="slice-value">全体</output><button id="all">断面解除</button><span class="note">断面は表示のみ。SOURCEやワールドを変更しません。</span></div>
</div>
<script type="application/json" id="mab-data">__MAB_SCENE_JSON__</script>
<script>__MAB_VIEWER_JS__</script>
</body>
</html>
