name: Windows GUI + pinned SOURCE release smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'build_windows.bat'
      - 'build_windows_native.bat'
      - 'START_MAB_STUDIO.bat'
      - 'RUN_STUDIO_NATIVE.bat'
      - 'app/node_packaging.py'
      - 'RUN_WINDOWS_ACCEPTANCE.*'
      - '.github/workflows/windows-build.yml'

# Prefer the newest verified build; obsolete pushes must not publish late.
concurrency:
  group: ${{ github.ref == 'refs/heads/research/v11-owned-revision-bridge-20261128' && 'mabstudio-p1-offline-candidate' || 'mabstudio-v03-verified-windows-release' }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and independently hash-check the single reviewed B143 module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = Join-Path $env:RUNNER_TEMP 'mab-b143-verified'
          $source = Join-Path $engine 'source/ai/b143-building-dsl.mjs'
          New-Item -ItemType Directory -Force (Split-Path $source -Parent) | Out-Null
          $commit = 'b0295c2f5012877f57ae218ae791634794de7b52'
          $url = "https://raw.githubusercontent.com/ryomashibaba/MinecraftAIBuilder/$commit/source/ai/b143-building-dsl.mjs"
          Invoke-WebRequest -Uri $url -OutFile $source
          $sha = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '537aa9e4a2b4e027f16179ef7a306b604ca4d850713d6de23940667ed2348e16') { throw 'B143_SOURCE_HASH_MISMATCH' }
          "MAB_B143_VERIFIED_ENGINE=$engine" >> $env:GITHUB_ENV
      - name: Focused SOURCE and Education regression (no Tk runner dependency)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # setup-python's Tcl/Tk scripts must be resolved from the SAME Python,
          # not an unrelated runner-installed Tcl. Otherwise Windows runners
          # can intermittently fail creating Tk with tcl_findLibrary errors.
          $pyRoot = (python -c "import sys; print(sys.base_prefix)").Trim()
          $tcl = Join-Path $pyRoot 'tcl/tcl8.6'
          $tk = Join-Path $pyRoot 'tcl/tk8.6'
          if (!(Test-Path -LiteralPath (Join-Path $tcl 'init.tcl') -PathType Leaf) -or
              !(Test-Path -LiteralPath (Join-Path $tk 'tk.tcl') -PathType Leaf)) {
            throw 'SETUP_PYTHON_TCL_TK_LIBRARIES_MISSING'
          }
          $env:TCL_LIBRARY = $tcl
          $env:TK_LIBRARY = $tk
          python -c "import tkinter as tk; [(lambda r: (r.withdraw(), r.destroy()))(tk.Tk()) for _ in range(3)]"
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_TK_BOOTSTRAP_FAILED' }
          python -m pip install pytest pytest-timeout
          if ($LASTEXITCODE -ne 0) { throw 'PYTEST_INSTALL_FAILED' }
          # This Windows runner intermittently fails Tk initialization (missing
          # tk8.6/msgs/en.msg). Gate SOURCE, Education, persistence, and packaging
          # here; the packaged EXE GUI/native rendering is independently tested
          # by the dedicated steps below. This is NOT a full GUI unit-test pass.
          python -m pytest -vv --maxfail=1 --tb=short -rs --timeout=120 --timeout-method=thread `
            tests/test_core.py `
            tests/test_education_build.py `
            tests/test_education_live.py `
            tests/test_education_readonly.py `
            tests/test_real_b143_integration.py `
            tests/test_revisions_terrain.py `
            tests/test_b143_output_contract.py `
            tests/test_source_metadata_repair.py `
            tests/test_release_guards.py `
            tests/test_node_packaging.py `
            tests/test_packaged_runtime.py `
            tests/test_v11_revision_bridge.py `
            tests/test_v11_feed_and_autoupdate.py
          if ($LASTEXITCODE -ne 0) { throw 'PYTEST_FAILED' }
      - name: Node read-only command allowlist offline test
        shell: pwsh
        run: |
          node app/education_runtime/bridge.mjs --self-test
      - name: Prepare isolated opt-in Education transport
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location app/education_runtime
          try {
            npm.cmd install --omit=dev --ignore-scripts --no-audit --no-fund --package-lock
            if ($LASTEXITCODE -ne 0) { throw 'EDUCATION_NPM_PREPARE_FAILED' }
          } finally {
            Pop-Location
          }
          $pkg = Get-Content -Raw app/education_runtime/node_modules/socket-be/package.json | ConvertFrom-Json
          if ($pkg.version -ne '2.8.0') { throw 'SOCKETBE_VERSION_MISMATCH' }
      - name: Native VTK and Pillow read-only Windows render QA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install 'vtk==9.6.2' 'Pillow>=10,<13'
          if ($LASTEXITCODE -ne 0) { throw 'VTK_INSTALL_FAILED' }
          # Hosted Windows runners have no OpenGL 3.2 device. Use a runner-only
          # Mesa OSMesa version that still ships osmesa.dll (removed in 25.1).
          # Never install drivers system-wide or bundle Mesa with the app.
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mab-runner-only-osmesa'
          $mesaArchive = Join-Path $env:RUNNER_TEMP 'mesa3d-24.3.4-release-msvc.7z'
          $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/24.3.4/mesa3d-24.3.4-release-msvc.7z'
          Invoke-WebRequest -Uri $url -OutFile $mesaArchive
          $archiveSize = (Get-Item -LiteralPath $mesaArchive).Length
          if ($archiveSize -ne 61425236) { throw 'OSMESA_ARCHIVE_SIZE_MISMATCH' }
          Write-Host ('Runner-only Mesa 24.3.4 SHA256: ' +
              (Get-FileHash -LiteralPath $mesaArchive -Algorithm SHA256).Hash.ToLowerInvariant())
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (!(Test-Path -LiteralPath $sevenZip -PathType Leaf)) { throw '7ZIP_NOT_AVAILABLE' }
          & $sevenZip t $mesaArchive | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'OSMESA_ARCHIVE_INVALID' }
          New-Item -ItemType Directory -Force -Path $mesaRoot | Out-Null
          & $sevenZip x -y "-o$mesaRoot" $mesaArchive 'x64/*' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'OSMESA_ARCHIVE_EXTRACT_FAILED' }
          $mesaBin = Join-Path $mesaRoot 'x64'
          if (!(Test-Path -LiteralPath (Join-Path $mesaBin 'osmesa.dll') -PathType Leaf) -or
              !(Test-Path -LiteralPath (Join-Path $mesaBin 'libglapi.dll') -PathType Leaf)) {
            throw 'OSMESA_REQUIRED_DLL_MISSING'
          }
          # Export only to this Actions job, including later packaged EXE pixel QA.
          # These environment settings are NOT bundled into the user's EXE.
          $env:PATH = "$mesaBin;$env:PATH"
          $env:VTK_DEFAULT_OPENGL_WINDOW = 'vtkOSOpenGLRenderWindow'
          $env:GALLIUM_DRIVER = 'llvmpipe'
          $mesaBin >> $env:GITHUB_PATH
          "VTK_DEFAULT_OPENGL_WINDOW=vtkOSOpenGLRenderWindow" >> $env:GITHUB_ENV
          "GALLIUM_DRIVER=llvmpipe" >> $env:GITHUB_ENV
          python -m app.native_selfcheck --report "$env:RUNNER_TEMP/mab-native-smoke.json"
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_RENDER_SELF_CHECK_FAILED' }
          $check = Get-Content -Raw "$env:RUNNER_TEMP/mab-native-smoke.json" | ConvertFrom-Json
          if ($check.result -ne 'PASS_NATIVE_READONLY_SELF_CHECK' -or !$check.paletteChangePixelsVerified -or $check.worldWrites -ne 0) { throw 'NATIVE_RENDER_SELF_CHECK_INVALID' }
      - name: Build isolated Windows GUI (bundled Node, native 3D, no Python requirement)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The previous artifact crashed on an RTX Windows PC because this
          # runner-only Mesa DLL was accidentally bundled under _internal.
          # PyInstaller's DLL discovery MUST NOT see the CI software renderer.
          $mesaBin = Join-Path $env:RUNNER_TEMP 'mab-runner-only-osmesa/x64'
          $mesaPath = $mesaBin.TrimEnd([char]92,[char]47)
          $env:PATH = (($env:PATH -split ';' |
            Where-Object { $_.TrimEnd([char]92,[char]47) -ine $mesaPath }) -join ';')
          Remove-Item Env:VTK_DEFAULT_OPENGL_WINDOW -ErrorAction SilentlyContinue
          Remove-Item Env:GALLIUM_DRIVER -ErrorAction SilentlyContinue
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'PYINSTALLER_INSTALL_FAILED' }
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name MABStudio --paths . --collect-all vtkmodules --hidden-import vtkmodules.vtkRenderingOpenGL2 --hidden-import vtkmodules.vtkIOImage --add-data 'app/engine_bridge.mjs;app' --add-data 'app/gpu_viewer_assets;app/gpu_viewer_assets' --add-data 'app/education_runtime;app/education_runtime' app/main.py
          if ($LASTEXITCODE -ne 0) { throw 'EXE_BUILD_FAILED' }
          # No accidental Mesa renderer/driver may be shipped to real Windows
          # machines. Fail the build; do NOT silently delete DLLs post-build.
          $bad = @(Get-ChildItem -LiteralPath 'dist/MABStudio/_internal' -Recurse -File |
            Where-Object { $_.Name -match '^(?:libgallium.*|osmesa|libglapi|opengl32|libegl|libglesv2|mesa.*|gallium.*)[.]dll$' })
          if ($bad.Count -gt 0) {
            Write-Host ('CI-only graphics DLL found in release: ' + (($bad | ForEach-Object Name) -join ', '))
            throw 'CI_SOFTWARE_RENDERER_DLL_BUNDLED'
          }
          python -m app.node_packaging dist/MABStudio
          if ($LASTEXITCODE -ne 0) { throw 'NODE_PACKAGING_AND_LICENSE_FAILED' }
          if (!(Test-Path 'dist/MABStudio/MABStudio.exe')) { throw 'EXE_MISSING' }
      - name: Audit actual bundled Node.js and SocketBE, write runtime manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m app.release_audit dist/MABStudio
          if ($LASTEXITCODE -ne 0) { throw 'RUNTIME_MANIFEST_AUDIT_FAILED' }
      - name: Verify native 3D INSIDE the distributed EXE (not source Python)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:RUNNER_TEMP 'mab-exe-native-render.json'
          $exePath = (Resolve-Path './dist/MABStudio/MABStudio.exe').Path
          $args = @('--native-selfcheck', '--extended', '--report', ('"'+$report+'"'))
          $proc = Start-Process -FilePath $exePath -ArgumentList $args -PassThru
          if (!$proc.WaitForExit(120000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'PACKAGED_NATIVE_RENDER_TIMEOUT'
          }
          if ($proc.ExitCode -ne 0 -or !(Test-Path -LiteralPath $report)) { throw 'PACKAGED_NATIVE_RENDER_FAILED' }
          $check = Get-Content -Raw -LiteralPath $report -Encoding UTF8 | ConvertFrom-Json
          if ($check.result -ne 'PASS_NATIVE_READONLY_SELF_CHECK' -or
              !$check.packagedRuntimeVerified -or $check.runtimeMode -ne 'PACKAGED_ONEDIR' -or
              $check.cells -ne 64 -or !$check.paletteChangePixelsVerified -or
              $check.extendedScene.cells -ne 3128 -or
              $check.extendedScene.paletteEntries -ne 11 -or
              !$check.extendedScene.pixelChangeVerified -or
              !$check.extendedScene.cameraPixelChangeVerified -or
              !$check.extendedScene.dragPreviewVerified -or
              !$check.extendedScene.fullResolutionRestored -or
              $check.extendedScene.renderTimings.materialBoundaryEdges -lt 1 -or
              $check.renderTimings.samples -lt 10 -or
              $check.worldContacts -ne 0 -or $check.worldWrites -ne 0) {
            throw 'PACKAGED_NATIVE_RENDER_EVIDENCE_INVALID'
          }
          Write-Host 'Actual packaged EXE native VTK rendering PASS (synthetic SOURCE only).'
      - name: Launch real packaged EXE and render 917 verified B143 voxels
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:RUNNER_TEMP 'mab-studio-windows-smoke.json'
          $exePath = (Resolve-Path './dist/MABStudio/MABStudio.exe').Path
          $smokeArgs = @('--smoke','--smoke-engine', ('"'+$env:MAB_B143_VERIFIED_ENGINE+'"'), '--smoke-report', ('"'+$report+'"'))
          $smokeProcess = Start-Process -FilePath $exePath -ArgumentList $smokeArgs -PassThru
          if (!$smokeProcess.WaitForExit(120000)) {
            Stop-Process -Id $smokeProcess.Id -Force -ErrorAction SilentlyContinue
            throw 'PACKAGED_GUI_SMOKE_TIMEOUT'
          }
          if ($smokeProcess.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'PACKAGED_GUI_SMOKE_FAILED' }
          $status = Get-Content -Raw $report | ConvertFrom-Json
          if ($status.result -ne 'PASS' -or $status.sourceVoxels -ne 917 -or
              $status.guiRenderer -ne 'VTK_NATIVE_EMBEDDED' -or !$status.nativeScenePixelsVerified -or
              $status.nativeCells -ne 917 -or $status.worldWrites -ne 0) {
            throw 'PACKAGED_REAL_B143_OR_GUI_FAILED'
          }
          Write-Host "Packed Windows GUI/source smoke: $($status.result), $($status.sourceVoxels) voxels"
      - name: Packaged EXE end-to-end SOURCE and 3D via explicit localhost TEST DOUBLE (NOT real model)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:RUNNER_TEMP 'mab-windows-acceptance-test-double.json'
          $exePath = (Resolve-Path './dist/MABStudio/MABStudio.exe').Path
          $fixtureReady = Join-Path $env:RUNNER_TEMP 'mab-fixture-port.json'
          $fixture = Start-Process -FilePath (Get-Command python).Source -ArgumentList @('-m', 'tests.windows_acceptance_fixture', '--port', '0', '--ready-file', ('"'+$fixtureReady+'"')) -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            foreach ($attempt in 1..40) {
              if (Test-Path -LiteralPath $fixtureReady) { $ready = $true; break }
              Start-Sleep -Milliseconds 250
            }
            if (!$ready) { throw 'LOCAL_FIXTURE_DID_NOT_START' }
            $port = (Get-Content -Raw $fixtureReady | ConvertFrom-Json).port
            if ($port -lt 1 -or $port -gt 65535) { throw 'BAD_FIXTURE_PORT' }
            $acceptArgs = @('--acceptance','--test-double','--fixture-port',[string]$port, '--provider','Ollama', '--model','CI_TEST_DOUBLE', '--engine', ('"'+$env:MAB_B143_VERIFIED_ENGINE+'"'), '--report', ('"'+$report+'"'))
            $acceptProcess = Start-Process -FilePath $exePath -ArgumentList $acceptArgs -PassThru
            if (!$acceptProcess.WaitForExit(120000)) {
              Stop-Process -Id $acceptProcess.Id -Force -ErrorAction SilentlyContinue
              throw 'PACKAGED_ACCEPTANCE_TIMEOUT'
            }
            if ($acceptProcess.ExitCode -ne 0 -or !(Test-Path -LiteralPath $report)) { throw 'PACKAGED_ACCEPTANCE_FAILED' }
            $result = Get-Content -Raw -LiteralPath $report -Encoding UTF8 | ConvertFrom-Json
            if ($result.outcome -ne 'PASS_TEST_DOUBLE_SOURCE_AND_GUI_ONLY' -or !$result.testDoubleUsed -or $result.actualProviderRequestAttempted -or !$result.testDoubleRequestAttempted -or !$result.sourceValid -or
                !$result.guiRendered -or $result.source.voxelCount -ne 917 -or
                $result.worldWrites -ne 0 -or $result.minecraftEducationTested) {
              throw 'PACKAGED_ACCEPTANCE_INCONSISTENT'
            }
            Write-Host 'TEST-DOUBLE END-TO-END PASS. Not an actual local LLM test.'
          } finally {
            Stop-Process -Id $fixture.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Re-extract the delivered portable ZIP and verify EXE native SOURCE render
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = Join-Path $env:RUNNER_TEMP 'MABStudio-Windows-Native-Preview.zip'
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path './dist').Path, $archive)
          $portable = Join-Path $env:RUNNER_TEMP 'mab-extracted-portable'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $portable)
          $exe = Join-Path $portable 'MABStudio/MABStudio.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'PORTABLE_EXE_MISSING' }
          if ((Get-FileHash -Algorithm SHA256 $exe).Hash -ne
              (Get-FileHash -Algorithm SHA256 './dist/MABStudio/MABStudio.exe').Hash) {
            throw 'PORTABLE_EXE_HASH_MISMATCH'
          }
          $report = Join-Path $env:RUNNER_TEMP 'mab-extracted-native.json'
          $args = @('--native-selfcheck','--extended','--report',('"'+$report+'"'))
          $proc = Start-Process -FilePath $exe -ArgumentList $args -WorkingDirectory $portable -PassThru
          if (!$proc.WaitForExit(120000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'PORTABLE_NATIVE_3D_TIMEOUT'
          }
          if ($proc.ExitCode -ne 0 -or !(Test-Path -LiteralPath $report)) { throw 'PORTABLE_NATIVE_3D_FAILED' }
          $native = Get-Content -Raw -LiteralPath $report -Encoding UTF8 | ConvertFrom-Json
          if ($native.result -ne 'PASS_NATIVE_READONLY_SELF_CHECK' -or
              !$native.packagedRuntimeVerified -or $native.extendedScene.cells -ne 3128 -or
              !$native.extendedScene.cameraPixelChangeVerified -or !$native.extendedScene.fullResolutionRestored -or
              $native.worldWrites -ne 0 -or $native.worldContacts -ne 0) { throw 'PORTABLE_NATIVE_EVIDENCE_INVALID' }
          $smoke = Join-Path $env:RUNNER_TEMP 'mab-extracted-source-native.json'
          $args = @('--smoke','--smoke-engine',('"'+$env:MAB_B143_VERIFIED_ENGINE+'"'), '--smoke-report',('"'+$smoke+'"'))
          $proc = Start-Process -FilePath $exe -ArgumentList $args -WorkingDirectory $portable -PassThru
          if (!$proc.WaitForExit(120000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'PORTABLE_SOURCE_NATIVE_TIMEOUT'
          }
          if ($proc.ExitCode -ne 0 -or !(Test-Path -LiteralPath $smoke)) { throw 'PORTABLE_SOURCE_NATIVE_FAILED' }
          $status = Get-Content -Raw -LiteralPath $smoke -Encoding UTF8 | ConvertFrom-Json
          if ($status.result -ne 'PASS' -or $status.sourceVoxels -ne 917 -or
              $status.guiRenderer -ne 'VTK_NATIVE_EMBEDDED' -or !$status.nativeScenePixelsVerified -or
              $status.nativeCells -ne 917 -or $status.worldWrites -ne 0) { throw 'PORTABLE_SOURCE_NATIVE_EVIDENCE_INVALID' }
          Write-Host 'EXTRACTED PORTABLE EXE native 3D and genuine pinned B143 917-cell GUI PASS (not real model).'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MABStudio-Windows-Native-Preview
          path: ${{ runner.temp }}/MABStudio-Windows-Native-Preview.zip
          retention-days: 14
      - name: Publish verified portable app release for automatic updates
        if: success() && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $file = Join-Path $env:RUNNER_TEMP 'MABStudio-Windows-Native-Preview.zip'
          if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
            throw 'VERIFIED_PORTABLE_ZIP_MISSING'
          }
          $tag = 'mabstudio-v03-' + $env:GITHUB_SHA
          & gh release create $tag $file --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA --latest `
            --title ('MAB Studio v0.3 verified ' + $env:GITHUB_SHA.Substring(0,12)) `
            --notes 'Windows native EXE: CI SOURCE/3D/portable re-extraction PASS. Real local LLM and Minecraft Education world writes require separate acceptance.'
          if ($LASTEXITCODE -ne 0) { throw 'VERIFIED_RELEASE_PUBLISH_FAILED' }
